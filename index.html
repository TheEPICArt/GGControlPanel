/* =========================================================
   CURRENT ROOM
   ========================================================= */

let currentRoom = null;

var task;

var username = "admin";

var ip2;

let moveInterval = null;


/* =========================================================
   ROOM SELECTION
   ========================================================= */

function selectRoom(roomKey) {

    const room = rooms[roomKey];

    if (!room) {
        console.error("Unknown room:", roomKey);
        return;
    }

    currentRoom = roomKey;

    ip1 = room.ip1;
    ip2 = room.ip2;

    console.log("Selected room:", room.name);
    console.log("Camera 1:", ip1);
    console.log("Camera 2:", ip2);

    document.getElementById("roomSelection").style.display = "none";
    document.getElementById("controller").style.display = "block";

    document.body.style.backgroundImage =
        `url("${room.background}")`;

    loadAudio(room);

    resetPuzzles();
    startViewer();
}


/* =========================================================
   AUDIO
   ========================================================= */

function loadAudio(room) {

    const audioPlayer =
        document.getElementById("audioPlayer");

    audioPlayer.innerHTML = "";

    room.sounds.forEach((sound, index) => {

        const item =
            document.createElement("div");

        item.className = "audioItem";


        const caption =
            document.createElement("figcaption");

        caption.textContent =
            sound.name + ":";


        const audio =
            document.createElement("audio");

        audio.controls = true;
        audio.src = sound.file;

        if (sound.loop) {
            audio.loop = true;
        }


        /*
         * Stop every other sound when a new
         * sound starts.
         */

        audio.addEventListener("play", () => {

            document
                .querySelectorAll("#audioPlayer audio")
                .forEach(other => {

                    if (other !== audio) {

                        other.pause();
                        other.currentTime = 0;

                    }

                });

        });


        item.appendChild(caption);
        item.appendChild(audio);

        audioPlayer.appendChild(item);

    });

}

/* =========================================================
   PUZZLE SYSTEM
   ========================================================= */

let completedPuzzles = [];
let puzzleCompletionTimes = {};


/* =========================================================
   RESET PUZZLES
   ========================================================= */

function resetPuzzles() {

    completedPuzzles = [];
    puzzleCompletionTimes = {};

    renderPuzzles();

}


/* =========================================================
   CHECK IF PUZZLE IS AVAILABLE
   ========================================================= */

function isPuzzleAvailable(puzzle) {

    /*
     * A puzzle is available if every puzzle
     * listed in "requires" has already been completed.
     */

    return puzzle.requires.every(
        requirement =>
            completedPuzzles.includes(requirement)
    );

}


/* =========================================================
   COMPLETE PUZZLE
   ========================================================= */

function completePuzzle(puzzleName) {

    if (!currentRoom) return;

    /*
     * Don't allow a puzzle to be completed twice.
     */

    if (completedPuzzles.includes(puzzleName)) {
        return;
    }


    const room =
        rooms[currentRoom];


    const puzzle =
        room.puzzles.find(
            p => p.name === puzzleName
        );


    if (!puzzle) {
        console.error(
            "Puzzle not found:",
            puzzleName
        );

        return;
    }


    /*
     * Make sure the puzzle is actually available.
     */

    if (!isPuzzleAvailable(puzzle)) {

        console.warn(
            "Puzzle is not available:",
            puzzleName
        );

        return;

    }


    /*
     * Record completion.
     */

    completedPuzzles.push(
        puzzleName
    );


    /*
     * Store the exact time.
     */

    puzzleCompletionTimes[puzzleName] =
        new Date();


    console.log(
        "Puzzle completed:",
        puzzleName,
        puzzleCompletionTimes[puzzleName]
    );


    /*
     * Rebuild the puzzle panel.
     */

    renderPuzzles();

}


/* =========================================================
   FORMAT COMPLETION TIME
   ========================================================= */

function formatPuzzleTime(date) {

    return date.toLocaleTimeString(
        [],
        {
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit"
        }
    );

}


/* =========================================================
   RENDER PUZZLES
   ========================================================= */

function renderPuzzles() {

    const availableContainer =
        document.getElementById(
            "availablePuzzles"
        );


    const completedContainer =
        document.getElementById(
            "completedPuzzles"
        );


    if (!availableContainer ||
        !completedContainer) {

        return;

    }


    availableContainer.innerHTML = "";
    completedContainer.innerHTML = "";


    /*
     * Don't do anything if a room hasn't
     * been selected yet.
     */

    if (!currentRoom) {
        return;
    }


    const room =
        rooms[currentRoom];


    /*
     * AVAILABLE PUZZLES
     */

    room.puzzles.forEach(
        puzzle => {

            /*
             * Don't show puzzles that are
             * already completed.
             */

            if (
                completedPuzzles.includes(
                    puzzle.name
                )
            ) {

                return;

            }


            /*
             * Only show puzzles whose
             * prerequisites are complete.
             */

            if (
                !isPuzzleAvailable(
                    puzzle
                )
            ) {

                return;

            }


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "puzzleButton";


            button.textContent =
                puzzle.name;


            button.addEventListener(
                "click",
                () => {

                    completePuzzle(
                        puzzle.name
                    );

                }
            );


            availableContainer.appendChild(
                button
            );

        }
    );


    /*
     * If there are no available puzzles.
     */

    if (
        availableContainer.children.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.textContent =
            "No puzzles currently available.";


        empty.style.color =
            "#888";


        empty.style.padding =
            "5px";


        availableContainer.appendChild(
            empty
        );

    }


    /*
     * COMPLETED PUZZLES
     */

    completedPuzzles.forEach(
        puzzleName => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "completedPuzzle";


            const name =
                document.createElement(
                    "span"
                );


            name.className =
                "completedPuzzleName";


            name.textContent =
                puzzleName;


            const time =
                document.createElement(
                    "span"
                );


            time.className =
                "completedPuzzleTime";


            time.textContent =
                formatPuzzleTime(
                    puzzleCompletionTimes[
                        puzzleName
                    ]
                );


            row.appendChild(name);
            row.appendChild(time);


            completedContainer.appendChild(
                row
            );

        }
    );

}

/* =========================================================
   CAMERA PTZ
   ========================================================= */

function startPtz(command) {

    stopPtz();

    command = getRoomAdjustedCommand(command);

    sendCommand(command, ip1);

}


function startPtz2(command) {

    stopPtz();

    command = getRoomAdjustedCommand(command);

    sendCommand(command, ip2);

}


function stopPtz() {

    if (!ip1 || !ip2) return;

    sendCommand("ptzStopRun", ip1);
    sendCommand("ptzStopRun", ip2);

}


/* =========================================================
   ROOM-SPECIFIC PTZ DIRECTION
   ========================================================= */

function getRoomAdjustedCommand(command) {

    /*
     * Heist cameras are physically mounted/oriented
     * opposite to the other rooms.
     *
     * Therefore, reverse the directional controls
     * only when Heist is selected.
     */

    if (currentRoom == "heist") {
        return command;
    }


    const reverseMap = {

        ptzMoveUp: "ptzMoveDown",
        ptzMoveDown: "ptzMoveUp",

        ptzMoveLeft: "ptzMoveRight",
        ptzMoveRight: "ptzMoveLeft",

        ptzMoveTopLeft: "ptzMoveBottomRight",
        ptzMoveTopRight: "ptzMoveBottomLeft",

        ptzMoveBottomLeft: "ptzMoveTopRight",
        ptzMoveBottomRight: "ptzMoveTopLeft"

    };


    return reverseMap[command] || command;

}


/* =========================================================
   CAMERA COMMANDS
   ========================================================= */

function sendCommand(command, ip) {

    const commandMap = {

        ptzMoveUp: 0,
        ptzMoveDown: 2,

        ptzMoveLeft: 6,
        ptzMoveRight: 4,

        ptzMoveTopLeft: 91,
        ptzMoveTopRight: 90,

        ptzMoveBottomLeft: 93,
        ptzMoveBottomRight: 92,

        ptzReset: 25,

        ptzStopRun: 1

    };


    const cmdValue =
        commandMap[command];


    if (cmdValue === undefined) {

        console.error(
            "Unknown PTZ command:",
            command
        );

        return;

    }


    if (!ip) {

        console.error(
            "No camera IP selected."
        );

        return;

    }


    const url =
        `http://${ip}/decoder_control.cgi?user=${username}&pwd=${password}&command=${cmdValue}`;


    console.log(
        "Sending command:",
        command,
        "→",
        cmdValue,
        "to",
        ip
    );


    fetch(url)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Camera command failed: " +
                    response.statusText
                );

            }

            return response.text();

        })

        .then(data => {

            console.log(
                "Camera responded:",
                data
            );

        })

        .catch(error => {

            console.error(
                "Error sending command:",
                error
            );

        });

}

    if (!ip1 || !ip2) return;


    var d = new Date();

    var url =

        `http://${ip2}/videostream.cgi?&user=${username}&pwd=${password}&cmd=snapPicture2&cachebust=${t}`;


    document.getElementById(
        "webcamSnapshot"
    ).src = url;


    document.getElementById(
        "webcamSnapshot2"
    ).src = url2;

}


function startViewer() {

    getSnapshot();

}

    if (isNaN(panTiltDuration)) {

/* =========================================================
   COMMAND SERVER
   ========================================================= */

async function sendCmd(cmd) {

    try {

        const resp =
            await fetch(
                'http://10.0.1.145:5000/cmd',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({
                        cmd
                    })

                }
            );


        const text =
            await resp.text();


        console.log(
            "Command response:",
            text
        );


    } catch (e) {

        console.error(
            "Error sending command:",
            e
        );

    }

}


/* =========================================================
   DRAGGABLE WINDOWS
   ========================================================= */

function makeDraggable(panel, handle) {

    let dragging = false;

    let startMouseX = 0;
    let startMouseY = 0;

    let startLeft = 0;
    let startTop = 0;


    handle.addEventListener(
        "pointerdown",
        function(event) {

            /*
             * Only the drag handle starts dragging.
             * Buttons/audio controls remain clickable.
             */

            dragging = true;

            panel.classList.add("dragging");

            startMouseX = event.clientX;
            startMouseY = event.clientY;

            const rect =
                panel.getBoundingClientRect();

            startLeft = rect.left;
            startTop = rect.top;


            /*
             * Convert from the current position
             * to explicit left/top coordinates.
             */

            panel.style.left =
                startLeft + "px";

            panel.style.top =
                startTop + "px";

            panel.style.right =
                "auto";


            handle.setPointerCapture(
                event.pointerId
            );


            event.preventDefault();

        }
    );


    handle.addEventListener(
        "pointermove",
        function(event) {

            if (!dragging) return;


            const deltaX =
                event.clientX - startMouseX;

            const deltaY =
                event.clientY - startMouseY;


            let newLeft =
                startLeft + deltaX;

            let newTop =
                startTop + deltaY;


            /*
             * Keep the panel at least partially
             * inside the screen.
             */

            const rect =
                panel.getBoundingClientRect();


            const maxLeft =
                window.innerWidth -
                rect.width;


            const maxTop =
                window.innerHeight -
                rect.height;


            newLeft =
                Math.max(
                    0,
                    Math.min(
                        newLeft,
                        maxLeft
                    )
                );


            newTop =
                Math.max(
                    0,
                    Math.min(
                        newTop,
                        maxTop
                    )
                );


            panel.style.left =
                newLeft + "px";

            panel.style.top =
                newTop + "px";

        }
    );


    handle.addEventListener(
        "pointerup",
        function(event) {

            dragging = false;

            panel.classList.remove(
                "dragging"
            );

            try {

                handle.releasePointerCapture(
                    event.pointerId
                );

            } catch (e) {}

        }
    );


    handle.addEventListener(
        "pointercancel",
        function() {

            dragging = false;

            panel.classList.remove(
                "dragging"
            );

        }
    );

}


/* =========================================================
   INITIALIZE DRAGGING
   ========================================================= */

function initDragging() {

    const panels = [
        "timerPanel",
        "cameraPanel1",
        "cameraPanel2",
        "audioPanel",
        "puzzlePanel"
    ];


    panels.forEach(id => {

        const panel =
            document.getElementById(id);

        const handle =
            panel.querySelector(".dragHandle");


        makeDraggable(
            panel,
            handle
        );

    });

}


/* =========================================================
   PAGE INITIALIZATION
   ========================================================= */

function initPage() {

    document.getElementById(
        "roomSelection"
    ).style.display = "flex";


    document.getElementById(
        "controller"
    ).style.display = "none";


    initDragging();

}


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        document
            .querySelectorAll(".draggablePanel")
            .forEach(panel => {

                const rect =
                    panel.getBoundingClientRect();


                let left = rect.left;
                let top = rect.top;


                if (
                    rect.right >
                    window.innerWidth
                ) {

                    left =
                        window.innerWidth -
                        rect.width;

                }


                if (
                    rect.bottom >
                    window.innerHeight
                ) {

                    top =
                        window.innerHeight -
                        rect.height;

                }


                panel.style.left =
                    Math.max(0, left) + "px";

                panel.style.top =
                    Math.max(0, top) + "px";

                panel.style.right =
                    "auto";

            });

    }
);

</script>

<!-- =======================================================
     TIMER JAVASCRIPT
     ======================================================= -->

<script>

let timerDuration = 60 * 60;
let timerRemaining = timerDuration;
let timerInterval = null;
let timerSpeed = 1;
let lastTimestamp = null;


const timerDisplay =
    document.getElementById(
        'timerDisplay'
    );


const startButton =
    document.getElementById(
        'startButton'
    );


const pauseButton =
    document.getElementById(
        'pauseButton'
    );


const resetButton =
    document.getElementById(
        'resetButton'
    );


const speedSelect =
    document.getElementById(
        'speedSelect'
    );


let timerWindow = null;


/* =========================================================
   OPEN TIMER WINDOW
   ========================================================= */

document
    .getElementById("openTimerWindow")
    .addEventListener(
        "click",
        () => {

            if (
                !timerWindow ||
                timerWindow.closed
            ) {

                timerWindow =
                    window.open(
                        "",
                        "TimerWindow",
                        "width=800,height=400"
                    );


                const doc =
                    timerWindow.document;


                doc.title = "Timer";


                const style =
                    doc.createElement("style");


                style.textContent = `

                    html,
                    body {
                        margin:0;
                        padding:0;
                        height:100%;
                        width:100%;
                        overflow:hidden;
                        font-family:Arial,sans-serif;
                    }

                    @font-face {
                        font-family:heistfont;
                        src:url(heistfont.ttf);
                    }

                    #overlay {
                        background-color:red;
                        color:white;
                        display:flex;
                        justify-content:center;
                        align-items:center;
                        height:100%;
                        width:100%;
                        font-size:1.5em;
                        cursor:pointer;
                        user-select:none;
                    }

                    #timerScreen {
                        display:none;
                        background-color:#111;
                        color:white;
                        height:100%;
                        width:100%;
                        justify-content:center;
                        align-items:center;
                        font-family:'heistfont',monospace;
                        font-size:30em;
                        font-weight:bold;
                    }

                    .timerChar {
                        position:absolute;
                        top:50%;
                        transform:translate(-50%,-50%);
                        text-align:center;
                        width:1ch;
                    }

                    #digit1 {
                        left:10%;
                    }

                    #digit2 {
                        left:30%;
                    }

                    #colon {
                        left:50%;
                    }

                    #digit3 {
                        left:70%;
                    }

                    #digit4 {
                        left:90%;
                    }

                `;


                doc.head.appendChild(style);


                const overlay =
                    doc.createElement("div");


                overlay.id = "overlay";

                overlay.textContent =
                    "Double click to fullscreen";


                doc.body.appendChild(
                    overlay
                );


                const timerScreen =
                    doc.createElement("div");


                timerScreen.id =
                    "timerScreen";


                const digit1 =
                    doc.createElement("span");


                digit1.className =
                    "timerChar";

                digit1.id =
                    "digit1";


                const digit2 =
                    doc.createElement("span");


                digit2.className =
                    "timerChar";

                digit2.id =
                    "digit2";


                const colon =
                    doc.createElement("span");


                colon.className =
                    "timerChar";

                colon.id =
                    "colon";

                colon.textContent =
                    ":";


                const digit3 =
                    doc.createElement("span");


                digit3.className =
                    "timerChar";

                digit3.id =
                    "digit3";


                const digit4 =
                    doc.createElement("span");


                digit4.className =
                    "timerChar";

                digit4.id =
                    "digit4";


                timerScreen.appendChild(
                    digit1
                );

                timerScreen.appendChild(
                    digit2
                );

                timerScreen.appendChild(
                    colon
                );

                timerScreen.appendChild(
                    digit3
                );

                timerScreen.appendChild(
                    digit4
                );


                doc.body.appendChild(
                    timerScreen
                );


                overlay.addEventListener(
                    "dblclick",
                    () => {

                        if (
                            doc.body
                                .requestFullscreen
                        ) {

                            doc.body
                                .requestFullscreen();

                        } else if (
                            doc.body
                                .webkitRequestFullscreen
                        ) {

                            doc.body
                                .webkitRequestFullscreen();

                        } else if (
                            doc.body
                                .msRequestFullscreen
                        ) {

                            doc.body
                                .msRequestFullscreen();

                        }


                        overlay.style.display =
                            "none";


                        timerScreen.style.display =
                            "flex";

                    }
                );


                function updatePopupTimerDisplay(
                    timeStr
                ) {

                    digit1.textContent =
                        timeStr[0];

                    digit2.textContent =
                        timeStr[1];

                    colon.textContent =
                        ":";

                    digit3.textContent =
                        timeStr[3];

                    digit4.textContent =
                        timeStr[4];

                }


                timerWindow.addEventListener(
                    "message",
                    (event) => {

                        if (
                            event.data.timer !==
                            undefined
                        ) {

                            updatePopupTimerDisplay(
                                event.data.timer
                            );

                        }

                    }
                );


                sendTimerUpdate();


            } else {

                timerWindow.focus();

            }

        }
    );


/* =========================================================
   CLOSE TIMER WINDOW
   ========================================================= */

document
    .getElementById("closeTimerWindow")
    .addEventListener(
        "click",
        function() {

            if (
                timerWindow &&
                !timerWindow.closed
            ) {

                timerWindow.close();

            }

        }
    );


/* =========================================================
   SEND TIMER TO POPUP
   ========================================================= */

function sendTimerUpdate() {

    if (
        timerWindow &&
        !timerWindow.closed
    ) {

        const displayValue =
            document
                .getElementById(
                    "timerDisplay"
                )
                .textContent;


        timerWindow.postMessage(
            {
                timer: displayValue
            },
            "*"
        );

    }

}


/* =========================================================
   UPDATE TIMER
   ========================================================= */

function updateTimerDisplay() {

    const minutes =
        Math.floor(
            timerRemaining / 60
        );


    const seconds =
        Math.floor(
            timerRemaining % 60
        );


    timerDisplay.textContent =
        `${minutes
            .toString()
            .padStart(2, '0')
        }:${
            seconds
            .toString()
            .padStart(2, '0')
        }`;


    sendTimerUpdate();

}


/* =========================================================
   TIMER LOOP
   ========================================================= */

function tick(currentTime) {

    if (!lastTimestamp) {

        lastTimestamp =
            currentTime;

    }


    const delta =
        (currentTime -
            lastTimestamp) / 1000;


    lastTimestamp =
        currentTime;


    timerRemaining -=
        delta * timerSpeed;


    if (timerRemaining <= 0) {

        timerRemaining = 0;

        cancelAnimationFrame(
            timerInterval
        );

        timerInterval = null;

    }


    updateTimerDisplay();


    if (timerInterval) {

        timerInterval =
            requestAnimationFrame(
                tick
            );

    }

}


/* =========================================================
   TIMER CONTROLS
   ========================================================= */

function startTimer() {

    if (timerInterval) return;

    lastTimestamp = null;

    timerInterval =
        requestAnimationFrame(
            tick
        );

}


function pauseTimer() {

    cancelAnimationFrame(
        timerInterval
    );

    timerInterval = null;

    lastTimestamp = null;

}


function resetTimer() {

    pauseTimer();

    timerRemaining =
        timerDuration;

    updateTimerDisplay();

}


speedSelect.addEventListener(
    'change',
    (e) => {

        timerSpeed =
            parseFloat(
                e.target.value
            );

    }
);


startButton.addEventListener(
    'click',
    startTimer
);


pauseButton.addEventListener(
    'click',
    pauseTimer
);


resetButton.addEventListener(
    'click',
    resetTimer
);


updateTimerDisplay();

</script>
