<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;

body {

  background-color: #E5B96E;

/* =========================================================
   ROOM SELECTION SCREEN
   ========================================================= */

#roomSelection {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#roomSelection h1 {
  font-size: 48px;
  margin-bottom: 50px;
  color: white;
}

.roomButtons {
  display: flex;
  gap: 30px;
}

.roomButton {
  width: 220px;

  font-weight: bold;
  color: white;
  background: #222;
  border: 3px solid #777;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.2s;
}

.roomButton:hover {
  background: #60A080;
  border-color: white;

}


/* =========================================================
   MAIN CONTROLLER
   ========================================================= */

#controller {
  display: none;
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
}


/* =========================================================
   DRAGGABLE PANELS
   ========================================================= */

.draggablePanel {
  position: absolute;
  z-index: 10;

.dragHandle {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(0, 0, 0, 0.85);
  color: white;

  border-radius: 10px 10px 0 0;

  font-weight: bold;
  cursor: grab;

  user-select: none;
  touch-action: none;
}

.dragHandle:active {
  cursor: grabbing;
}


/* =========================================================
   TIMER
   ========================================================= */

#timerPanel {
  left: 30px;
  top: 30px;
  width: 320px;
}

#timerContainer {
  text-align: center;
  background-color: black;
  border-radius: 0 0 12px 12px;
  padding: 10px;
  color: white;
}

#timerDisplay {

}


/* =========================================================
   CAMERA PANELS
   ========================================================= */

#cameraPanel1 {
  left: 30px;
  top: 220px;
  width: 40vw;
}

#cameraPanel2 {
  left: calc(40vw + 70px);
  top: 220px;

}

.cameraContainer {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.5);

}

  display: block;
  width: 100%;
  height: auto;
  border: 2px solid #787272;
  border-top: none;
  border-radius: 0 0 10px 10px;

/* =========================================================
   PTZ CONTROLS
   ========================================================= */

#ptzControls,

  background-color: rgba(0, 0, 0, 0.35);

}

}

/* =========================================================

            },
            {

                loop: false
            },

                file: "grinding-and-birds.mp3",
                loop: false
            }
        ]
    }

};


/* =========================================================
   CURRENT ROOM
   ========================================================= */

let currentRoom = null;

var task;
var panTiltDuration = 500;
var username = "admin";
var password = "handsome1984";

var ip1;
var ip2;

let moveInterval = null;


/* =========================================================
   ROOM SELECTION
   ========================================================= */

function selectRoom(roomKey) {

    const room = rooms[roomKey];

    if (!room) {
        console.error("Unknown room:", roomKey);
        return;
    }

    currentRoom = roomKey;

    ip1 = room.ip1;
    ip2 = room.ip2;

    console.log("Selected room:", room.name);
    console.log("Camera 1:", ip1);
    console.log("Camera 2:", ip2);

    document.getElementById("roomSelection").style.display = "none";
    document.getElementById("controller").style.display = "block";

    document.body.style.backgroundImage =
        `url("${room.background}")`;

    loadAudio(room);

    startViewer();
}


/* =========================================================
   AUDIO
   ========================================================= */

function loadAudio(room) {

    const audioPlayer =
        document.getElementById("audioPlayer");

    audioPlayer.innerHTML = "";

    room.sounds.forEach((sound, index) => {

        const item =
            document.createElement("div");

        item.className = "audioItem";


        const caption =
            document.createElement("figcaption");

        caption.textContent =
            sound.name + ":";


        const audio =
            document.createElement("audio");

        audio.controls = true;
        audio.src = sound.file;

        if (sound.loop) {
            audio.loop = true;
        }


        /*
         * Stop every other sound when a new
         * sound starts.
         */

        audio.addEventListener("play", () => {

            document
                .querySelectorAll("#audioPlayer audio")
                .forEach(other => {

                    if (other !== audio) {

                        other.pause();
                        other.currentTime = 0;

                    }

                });

        });


        item.appendChild(caption);
        item.appendChild(audio);

        audioPlayer.appendChild(item);

    });

}


/* =========================================================
   CAMERA PTZ
   ========================================================= */

function startPtz(command) {

    stopPtz();

    command = getRoomAdjustedCommand(command);

    sendCommand(command, ip1);

}


function startPtz2(command) {

    stopPtz();

    command = getRoomAdjustedCommand(command);

    sendCommand(command, ip2);

}


function stopPtz() {

    if (!ip1 || !ip2) return;

    sendCommand("ptzStopRun", ip1);
    sendCommand("ptzStopRun", ip2);

}


/* =========================================================
   ROOM-SPECIFIC PTZ DIRECTION
   ========================================================= */

function getRoomAdjustedCommand(command) {

    /*
     * Heist cameras are physically mounted/oriented
     * opposite to the other rooms.
     *
     * Therefore, reverse the directional controls
     * only when Heist is selected.
     */

    if (currentRoom == "heist") {
        return command;
    }


    const reverseMap = {

        ptzMoveUp: "ptzMoveDown",
        ptzMoveDown: "ptzMoveUp",

        ptzMoveLeft: "ptzMoveRight",
        ptzMoveRight: "ptzMoveLeft",

        ptzMoveTopLeft: "ptzMoveBottomRight",
        ptzMoveTopRight: "ptzMoveBottomLeft",

        ptzMoveBottomLeft: "ptzMoveTopRight",
        ptzMoveBottomRight: "ptzMoveTopLeft"

    };


    return reverseMap[command] || command;

}


/* =========================================================
   CAMERA COMMANDS
   ========================================================= */

function sendCommand(command, ip) {

    const commandMap = {

        ptzMoveUp: 0,
        ptzMoveDown: 2,

        ptzMoveLeft: 6,
        ptzMoveRight: 4,

        ptzMoveTopLeft: 91,
        ptzMoveTopRight: 90,

        ptzMoveBottomLeft: 93,
        ptzMoveBottomRight: 92,

        ptzReset: 25,

        ptzStopRun: 1

    };


    const cmdValue =
        commandMap[command];


    if (cmdValue === undefined) {

        console.error(
            "Unknown PTZ command:",
            command
        );

        return;

    }


    if (!ip) {

        console.error(
            "No camera IP selected."
        );

        return;

    }


    const url =
        `http://${ip}/decoder_control.cgi?user=${username}&pwd=${password}&command=${cmdValue}`;


    console.log(
        "Sending command:",
        command,
        "→",
        cmdValue,
        "to",
        ip
    );


    fetch(url)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Camera command failed: " +
                    response.statusText
                );

            }

            return response.text();

        })

        .then(data => {

            console.log(
                "Camera responded:",
                data
            );

        })

        .catch(error => {

            console.error(
                "Error sending command:",
                error
            );

        });

}


/* =========================================================
   CAMERA SNAPSHOTS
   ========================================================= */

function getSnapshot() {

    if (!ip1 || !ip2) return;


    var d = new Date();
    var t = d.getTime();


    var url =
        `http://${ip1}/videostream.cgi?&user=${username}&pwd=${password}&cmd=snapPicture2&cachebust=${t}`;


    var url2 =
        `http://${ip2}/videostream.cgi?&user=${username}&pwd=${password}&cmd=snapPicture2&cachebust=${t}`;


    document.getElementById(
        "webcamSnapshot"
    ).src = url;


    document.getElementById(
        "webcamSnapshot2"
    ).src = url2;

}


function startViewer() {

    getSnapshot();

}

    panTiltDuration =
        parseFloat(

    if (isNaN(panTiltDuration)) {

        panTiltDuration = 500;

    }

}


/* =========================================================
   COMMAND SERVER
   ========================================================= */

async function sendCmd(cmd) {

    try {

        const resp =
            await fetch(
                'http://10.0.1.145:5000/cmd',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({
                        cmd
                    })

                }
            );


        const text =
            await resp.text();


        console.log(
            "Command response:",
            text
        );


    } catch (e) {

        console.error(
            "Error sending command:",
            e
        );

    }

}


/* =========================================================
   DRAGGABLE WINDOWS
   ========================================================= */

function makeDraggable(panel, handle) {

    let dragging = false;

    let startMouseX = 0;
    let startMouseY = 0;

    let startLeft = 0;
    let startTop = 0;


    handle.addEventListener(
        "pointerdown",
        function(event) {

            /*
             * Only the drag handle starts dragging.
             * Buttons/audio controls remain clickable.
             */

            dragging = true;

            panel.classList.add("dragging");

            startMouseX = event.clientX;
            startMouseY = event.clientY;

            const rect =
                panel.getBoundingClientRect();

            startLeft = rect.left;
            startTop = rect.top;


            /*
             * Convert from the current position
             * to explicit left/top coordinates.
             */

            panel.style.left =
                startLeft + "px";

            panel.style.top =
                startTop + "px";

            panel.style.right =
                "auto";


            handle.setPointerCapture(
                event.pointerId
            );


            event.preventDefault();

        }
    );


    handle.addEventListener(
        "pointermove",
        function(event) {

            if (!dragging) return;


            const deltaX =
                event.clientX - startMouseX;

            const deltaY =
                event.clientY - startMouseY;


            let newLeft =
                startLeft + deltaX;

            let newTop =
                startTop + deltaY;


            /*
             * Keep the panel at least partially
             * inside the screen.
             */

            const rect =
                panel.getBoundingClientRect();


            const maxLeft =
                window.innerWidth -
                rect.width;


            const maxTop =
                window.innerHeight -
                rect.height;


            newLeft =
                Math.max(
                    0,
                    Math.min(
                        newLeft,
                        maxLeft
                    )
                );


            newTop =
                Math.max(
                    0,
                    Math.min(
                        newTop,
                        maxTop
                    )
                );


            panel.style.left =
                newLeft + "px";

            panel.style.top =
                newTop + "px";

        }
    );


    handle.addEventListener(
        "pointerup",
        function(event) {

            dragging = false;

            panel.classList.remove(
                "dragging"
            );

            try {

                handle.releasePointerCapture(
                    event.pointerId
                );

            } catch (e) {}

        }
    );


    handle.addEventListener(
        "pointercancel",
        function() {

            dragging = false;

            panel.classList.remove(
                "dragging"
            );

        }
    );

}


/* =========================================================
   INITIALIZE DRAGGING
   ========================================================= */

function initDragging() {

    const panels = [
        "timerPanel",
        "cameraPanel1",
        "cameraPanel2",
        "audioPanel"
    ];


    panels.forEach(id => {

        const panel =
            document.getElementById(id);

        const handle =
            panel.querySelector(".dragHandle");


        makeDraggable(
            panel,
            handle
        );

    });

}


/* =========================================================
   PAGE INITIALIZATION
   ========================================================= */

function initPage() {

    document.getElementById(
        "roomSelection"
    ).style.display = "flex";


    document.getElementById(
        "controller"
    ).style.display = "none";


    initDragging();

}


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        document
            .querySelectorAll(".draggablePanel")
            .forEach(panel => {

                const rect =
                    panel.getBoundingClientRect();


                let left = rect.left;
                let top = rect.top;


                if (
                    rect.right >
                    window.innerWidth
                ) {

                    left =
                        window.innerWidth -
                        rect.width;

                }


                if (
                    rect.bottom >
                    window.innerHeight
                ) {

                    top =
                        window.innerHeight -
                        rect.height;

                }


                panel.style.left =
                    Math.max(0, left) + "px";

                panel.style.top =
                    Math.max(0, top) + "px";

                panel.style.right =
                    "auto";

            });

    }
);

</script>

                                onmousedown='startPtz2("ptzMoveLeft")'
                                onmouseup="stopPtz()"
                                onmouseleave="stopPtz()"
                            >
                                ←
                            </button>
                        </td>

                        <td>
                            <button
                                onmousedown='startPtz2("ptzReset")'
                                onmouseup="stopPtz()"
                                onmouseleave="stopPtz()"
                            >
                                ●
                            </button>
                        </td>

                        <td>
                            <button
                                onmousedown='startPtz2("ptzMoveRight")'
                                onmouseup="stopPtz()"
                                onmouseleave="stopPtz()"
                            >
                                →
                            </button>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            <button
                                onmousedown='startPtz2("ptzMoveBottomLeft")'
                                onmouseup="stopPtz()"
                                onmouseleave="stopPtz()"
                            >
                                ↙
                            </button>
                        </td>

                        <td>
                            <button
                                onmousedown='startPtz2("ptzMoveDown")'
                                onmouseup="stopPtz()"
                                onmouseleave="stopPtz()"
                            >
                                ↓
                            </button>
                        </td>

                        <td>
                            <button
                                onmousedown='startPtz2("ptzMoveBottomRight")'
                                onmouseup="stopPtz()"
                                onmouseleave="stopPtz()"
                            >
                                ↘
                            </button>
                        </td>

                </tbody>

            </table>

        </div>

    </div>


    <!-- ===================================================
         AUDIO
         =================================================== -->

    <div
        id="audioPanel"
        class="draggablePanel"
    >

        <div class="dragHandle">
            AUDIO CONTROLS
        </div>


        <div id="audioPlayer"></div>

    </div>


</div>


<!-- =======================================================
     TIMER JAVASCRIPT
     ======================================================= -->

<script>

let timerDuration = 60 * 60;
let timerRemaining = timerDuration;
let timerInterval = null;
let timerSpeed = 1;
let lastTimestamp = null;


const timerDisplay =
    document.getElementById(
        'timerDisplay'
    );


const startButton =
    document.getElementById(
        'startButton'
    );


const pauseButton =
    document.getElementById(
        'pauseButton'
    );


const resetButton =
    document.getElementById(
        'resetButton'
    );


const speedSelect =
    document.getElementById(
        'speedSelect'
    );


let timerWindow = null;


/* =========================================================
   OPEN TIMER WINDOW
   ========================================================= */

document
    .getElementById("openTimerWindow")
    .addEventListener(
        "click",
        () => {

            if (
                !timerWindow ||
                timerWindow.closed
            ) {

                timerWindow =
                    window.open(
                        "",
                        "TimerWindow",
                        "width=800,height=400"
                    );


                const doc =
                    timerWindow.document;


                doc.title = "Timer";


                const style =
                    doc.createElement("style");


                style.textContent = `

                    html,
                    body {
                        margin:0;
                        padding:0;
                        height:100%;
                        width:100%;
                        overflow:hidden;
                        font-family:Arial,sans-serif;
                    }

                    @font-face {
                        font-family:heistfont;
                        src:url(heistfont.ttf);
                    }

                    #overlay {
                        background-color:red;
                        color:white;
                        display:flex;
                        justify-content:center;
                        align-items:center;
                        height:100%;
                        width:100%;
                        font-size:1.5em;
                        cursor:pointer;
                        user-select:none;
                    }

                    #timerScreen {
                        display:none;
                        background-color:#111;
                        color:white;
                        height:100%;
                        width:100%;
                        justify-content:center;
                        align-items:center;
                        font-family:'heistfont',monospace;
                        font-size:30em;
                        font-weight:bold;
                    }

                    .timerChar {
                        position:absolute;
                        top:50%;
                        transform:translate(-50%,-50%);
                        text-align:center;
                        width:1ch;
                    }

                    #digit1 {
                        left:10%;
                    }

                    #digit2 {
                        left:30%;
                    }

                    #colon {
                        left:50%;
                    }

                    #digit3 {
                        left:70%;
                    }

                    #digit4 {
                        left:90%;
                    }

                `;


                doc.head.appendChild(style);


                const overlay =
                    doc.createElement("div");


                overlay.id = "overlay";

                overlay.textContent =
                    "Double click to fullscreen";


                doc.body.appendChild(
                    overlay
                );


                const timerScreen =
                    doc.createElement("div");


                timerScreen.id =
                    "timerScreen";


                const digit1 =
                    doc.createElement("span");


                digit1.className =
                    "timerChar";

                digit1.id =
                    "digit1";


                const digit2 =
                    doc.createElement("span");


                digit2.className =
                    "timerChar";

                digit2.id =
                    "digit2";


                const colon =
                    doc.createElement("span");


                colon.className =
                    "timerChar";

                colon.id =
                    "colon";

                colon.textContent =
                    ":";


                const digit3 =
                    doc.createElement("span");


                digit3.className =
                    "timerChar";

                digit3.id =
                    "digit3";


                const digit4 =
                    doc.createElement("span");


                digit4.className =
                    "timerChar";

                digit4.id =
                    "digit4";


                timerScreen.appendChild(
                    digit1
                );

                timerScreen.appendChild(
                    digit2
                );

                timerScreen.appendChild(
                    colon
                );

                timerScreen.appendChild(
                    digit3
                );

                timerScreen.appendChild(
                    digit4
                );


                doc.body.appendChild(
                    timerScreen
                );


                overlay.addEventListener(
                    "dblclick",
                    () => {

                        if (
                            doc.body
                                .requestFullscreen
                        ) {

                            doc.body
                                .requestFullscreen();

                        } else if (
                            doc.body
                                .webkitRequestFullscreen
                        ) {

                            doc.body
                                .webkitRequestFullscreen();

                        } else if (
                            doc.body
                                .msRequestFullscreen
                        ) {

                            doc.body
                                .msRequestFullscreen();

                        }


                        overlay.style.display =
                            "none";


                        timerScreen.style.display =
                            "flex";

                    }
                );


                function updatePopupTimerDisplay(
                    timeStr
                ) {

                    digit1.textContent =
                        timeStr[0];

                    digit2.textContent =
                        timeStr[1];

                    colon.textContent =
                        ":";

                    digit3.textContent =
                        timeStr[3];

                    digit4.textContent =
                        timeStr[4];

                }


                timerWindow.addEventListener(
                    "message",
                    (event) => {

                        if (
                            event.data.timer !==
                            undefined
                        ) {

                            updatePopupTimerDisplay(
                                event.data.timer
                            );

                        }

                    }
                );


                sendTimerUpdate();


            } else {

                timerWindow.focus();

            }

        }
    );


/* =========================================================
   CLOSE TIMER WINDOW
   ========================================================= */

document
    .getElementById("closeTimerWindow")
    .addEventListener(
        "click",
        function() {

            if (
                timerWindow &&
                !timerWindow.closed
            ) {

                timerWindow.close();

            }

        }
    );


/* =========================================================
   SEND TIMER TO POPUP
   ========================================================= */

function sendTimerUpdate() {

    if (
        timerWindow &&
        !timerWindow.closed
    ) {

        const displayValue =
            document
                .getElementById(
                    "timerDisplay"
                )
                .textContent;


        timerWindow.postMessage(
            {
                timer: displayValue
            },
            "*"
        );

    }

}


/* =========================================================
   UPDATE TIMER
   ========================================================= */

function updateTimerDisplay() {

    const minutes =
        Math.floor(
            timerRemaining / 60
        );


    const seconds =
        Math.floor(
            timerRemaining % 60
        );


    timerDisplay.textContent =
        `${minutes
            .toString()
            .padStart(2, '0')
        }:${
            seconds
            .toString()
            .padStart(2, '0')
        }`;


    sendTimerUpdate();

}


/* =========================================================
   TIMER LOOP
   ========================================================= */

function tick(currentTime) {

    if (!lastTimestamp) {

        lastTimestamp =
            currentTime;

    }


    const delta =
        (currentTime -
            lastTimestamp) / 1000;


    lastTimestamp =
        currentTime;


    timerRemaining -=
        delta * timerSpeed;


    if (timerRemaining <= 0) {

        timerRemaining = 0;

        cancelAnimationFrame(
            timerInterval
        );

        timerInterval = null;

    }


    updateTimerDisplay();


    if (timerInterval) {

        timerInterval =
            requestAnimationFrame(
                tick
            );

    }

}


/* =========================================================
   TIMER CONTROLS
   ========================================================= */

function startTimer() {

    if (timerInterval) return;

    lastTimestamp = null;

    timerInterval =
        requestAnimationFrame(
            tick
        );

}


function pauseTimer() {

    cancelAnimationFrame(
        timerInterval
    );

    timerInterval = null;

    lastTimestamp = null;

}


function resetTimer() {

    pauseTimer();

    timerRemaining =
        timerDuration;

    updateTimerDisplay();

}


speedSelect.addEventListener(
    'change',
    (e) => {

        timerSpeed =
            parseFloat(
                e.target.value
            );

    }
);


startButton.addEventListener(
    'click',
    startTimer
);


pauseButton.addEventListener(
    'click',
    pauseTimer
);


resetButton.addEventListener(
    'click',
    resetTimer
);


updateTimerDisplay();

</script>

</body>
</html>
